#####################
### DEVICE CONFIG
#####################

input {
    kb_layout = us
    follow_mouse = false
    sensitivity = 0
}

#####################
### APPEARANCE CONFIG
#####################

misc {
    force_default_wallpaper = false
    disable_hyprland_logo = true
}

general {
    gaps_in = 5
    gaps_out = 45, 220, 100, 220

    border_size = 2
    layout = dwindle
    resize_on_border = true     

    col.active_border = rgba(89b4faff)
    col.inactive_border = rgba(313244aa)
}

decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 0.92
    dim_inactive = true
    dim_strength = 0.12

    blur {
        enabled = true
        size = 6
        passes = 3
        ignore_opacity = true
        vibrancy = 0.2
        popups = true           
    }

    shadow {
        enabled = true
        range = 24
        render_power = 4
        color = rgba(00000055)
        color_inactive = rgba(00000022)
    }
}

animations {
    enabled = true

    # linear bezier
    bezier = linear, 0.0, 0.0, 1.0, 1.0

    # animate borderangle
    animation = borderangle, 1, 300, linear, loop
}

dwindle {
    preserve_split = true
    smart_split = true
    smart_resizing = true
}

group {
    col.border_active = rgba(89b4faff)
    col.border_inactive = rgba(313244aa)
    col.border_locked_active = rgba(89b4faff)
    col.border_locked_inactive = rgba(313244aa)

    groupbar {
        font_size = 10
        gradients = false
        col.active = rgba(89b4facc)
        col.inactive = rgba(31324488)
    }
}
