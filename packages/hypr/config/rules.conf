#####################
### WINDOW RULES
#####################

# Floating windows
windowrule {
    name = float-windows
    match:tag = floating-window
    float = on
    center = on
    size = 800 600
}

windowrule {
    name = tag-float-apps
    match:class = (blueberry.py|Impala|Wiremix|org.gnome.NautilusPreviewer|com.gabm.satty|Omarchy|About|TUI.float)
    tag = +floating-window
}

windowrule {
    name = tag-float-dialogs
    match:class = (xdg-desktop-portal-gtk|sublime_text|DesktopEditors|org.gnome.Nautilus)
    match:title = ^(Open.*Files?|Open Folder|Save.*Files?|Save.*As|Save|All Files)
    tag = +floating-window
}

# Notifications
windowrule {
    name = fix-notifications
    match:class = ^$
    match:title = ^$
    float = on
    move = monitor_w - window_w - 20 monitor_h - window_h - 20
    pin = on
    border_size = 0
}